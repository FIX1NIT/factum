<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960"><defs>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .4  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.6"/></filter>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f5ec"/><stop offset="1" stop-color="#ece6d6"/></linearGradient>
<filter id="wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".006 .14" numOctaves="4" seed="11" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .36  0 0 0 0 .22  0 0 0 0 .12  0 0 0 1.1 -.15"/></filter>
<linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".32"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation=".45"/></filter>
</defs>
<rect width="720" height="960" fill="#7a5632"/><rect width="720" height="960" filter="url(#wood)"/><rect width="720" height="960" fill="#000" fill-opacity=".12"/>
<g transform="translate(360 480) rotate(1.0) skewX(-2.2) skewY(.8) translate(-360 -480)"><g filter="url(#soft)"><g filter="url(#sh)"><rect x="60" y="50" width="600" height="860" fill="url(#pg)"/></g>
<rect x="60" y="50" width="600" height="860" fill="#fff" filter="url(#paper)"/>
<g transform="translate(60 50)"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2f7a"/></marker></defs><text x="300" y="80" font-size="22" font-weight="700" text-anchor="middle" font-family="Times New Roman,serif" letter-spacing="3">СХЕМА МЕСТА ДТП</text><text x="300" y="104" font-size="14" text-anchor="middle" font-family="Times New Roman,serif" fill="#444">Перекрёсток улиц Навои и Амира Темура · 14 ноября 2026 года, 08:40</text><rect x="250" y="130" width="100" height="520" fill="#8b9099"/><rect x="40" y="350" width="520" height="100" fill="#8b9099"/><line x1="300" y1="130" x2="300" y2="350" stroke="#f1f1f1" stroke-width="2" stroke-dasharray="14 10"/><line x1="300" y1="450" x2="300" y2="650" stroke="#f1f1f1" stroke-width="2" stroke-dasharray="14 10"/><line x1="40" y1="400" x2="250" y2="400" stroke="#f1f1f1" stroke-width="2" stroke-dasharray="14 10"/><line x1="350" y1="400" x2="560" y2="400" stroke="#f1f1f1" stroke-width="2" stroke-dasharray="14 10"/><rect x="250" y="350" width="100" height="100" fill="#8b9099"/><g><rect x="319" y="410" width="34" height="68" rx="7" fill="#3f66a8" stroke="#1d2f7a" stroke-width="2"/><text x="336" y="450" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">1</text></g><g><rect x="296" y="360" width="70" height="34" rx="7" fill="#b8503f" stroke="#6e2a20" stroke-width="2"/><text x="331" y="382" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">2</text></g><line x1="336" y1="540" x2="336" y2="486" stroke="#1d2f7a" stroke-width="3" marker-end="url(#ar)"/><line x1="470" y1="377" x2="376" y2="377" stroke="#6e2a20" stroke-width="3" marker-end="url(#ar)"/><g stroke="#c0392b" stroke-width="4"><line x1="327" y1="396" x2="345" y2="412"/><line x1="345" y1="396" x2="327" y2="412"/></g><text x="365" y="425" font-family="Arial" font-size="13" fill="#333">место удара</text><rect x="228" y="326" width="14" height="14" rx="3" fill="#2d3a4a"/><circle cx="235" cy="333" r="4" fill="#9aa3ad"/><rect x="358" y="326" width="14" height="14" rx="3" fill="#2d3a4a"/><circle cx="365" cy="333" r="4" fill="#9aa3ad"/><rect x="228" y="456" width="14" height="14" rx="3" fill="#2d3a4a"/><circle cx="235" cy="463" r="4" fill="#9aa3ad"/><rect x="358" y="456" width="14" height="14" rx="3" fill="#2d3a4a"/><circle cx="365" cy="463" r="4" fill="#9aa3ad"/><text x="130" y="320" font-family="Arial" font-size="13" fill="#333">светофор</text><text x="230" y="150" font-family="Arial" font-size="13" fill="#333">ул. Навои</text><text x="400" y="340" font-family="Arial" font-size="13" fill="#333">ул. Амира Темура</text><text x="60" y="690" font-family="Arial" font-size="13" fill="#333">1 – автомобиль 1 (водитель Ахмедов), движение вдоль улицы Навои.</text><text x="60" y="712" font-family="Arial" font-size="13" fill="#333">2 – автомобиль 2 (водитель Рашидов), движение по улице Амира Темура.</text><text x="60" y="742" font-size="12" fill="#555" font-family="Arial">Условная схема по справке и объяснениям. Масштаб не соблюдён.</text><text x="60" y="760" font-size="12" fill="#555" font-family="Arial">Схема не устанавливает, чей сигнал светофора был разрешающим.</text><g transform="rotate(-30 300 430)"><text x="300" y="450" font-size="44" font-weight="800" fill="#b03a2e" fill-opacity=".16" text-anchor="middle" font-family="Arial,sans-serif">ВЫМЫШЛЕНО · ОБРАЗЕЦ</text></g></g></g></g>
<rect width="720" height="960" fill="url(#glare)"/><rect width="720" height="960" fill="url(#vig)"/></svg>