<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960"><defs>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .4  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.6"/></filter>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f5ec"/><stop offset="1" stop-color="#ece6d6"/></linearGradient>
<filter id="wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".006 .14" numOctaves="4" seed="11" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .36  0 0 0 0 .22  0 0 0 0 .12  0 0 0 1.1 -.15"/></filter>
<linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".32"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation=".45"/></filter>
</defs>
<rect width="720" height="960" fill="#7a5632"/><rect width="720" height="960" filter="url(#wood)"/><rect width="720" height="960" fill="#000" fill-opacity=".12"/>
<g transform="translate(360 480) rotate(-2.0) skewX(-2.2) skewY(.8) translate(-360 -480)"><g filter="url(#soft)"><g filter="url(#sh)"><rect x="60" y="50" width="600" height="860" fill="url(#pg)"/></g>
<rect x="60" y="50" width="600" height="860" fill="#fff" filter="url(#paper)"/>
<g transform="translate(60 50)"><text x="300" y="90" font-size="24" font-weight="700" text-anchor="middle" font-family="Times New Roman,serif" letter-spacing="3">СПРАВКА О ДТП</text><text x="300" y="122" text-anchor="middle" font-family="Times New Roman,serif" font-size="19" fill="#1c1c1c">Перекрёсток улиц Навои и Амира Темура</text><text x="300" y="148" font-size="16" text-anchor="middle" font-family="Times New Roman,serif" fill="#444">14 ноября 2026 года, 08:40</text><text x="60" y="215" font-family="Times New Roman,serif" font-size="19" fill="#1c1c1c">Столкновение двух легковых автомобилей.</text><text x="60" y="247" font-family="Times New Roman,serif" font-size="19" fill="#1c1c1c">Автомобиль 1: повреждён передний бампер.</text><text x="60" y="279" font-family="Times New Roman,serif" font-size="19" fill="#1c1c1c">Автомобиль 2: повреждена правая сторона.</text><text x="60" y="311" font-family="Times New Roman,serif" font-size="19" fill="#1c1c1c">Светофор на перекрёстке работал.</text><text x="60" y="343" font-family="Times New Roman,serif" font-size="19" fill="#1c1c1c">Пострадавших нет.</text><text x="60" y="415" font-family="Times New Roman,serif" font-size="19" fill="#1c1c1c">Инспектор Н. Юлдашев</text><path d="M300 420 c18 -30 30 -34 34 -10 s10 22 28 -6 c8 -14 20 -22 30 -4 s24 16 44 -8" fill="none" stroke="#1d2f7a" stroke-width="2.4" stroke-linecap="round" filter="url(#ink)"/><g transform="rotate(-12 460 535)" opacity=".78" fill="none" stroke="#2c4fa3" stroke-width="3"><circle cx="460" cy="535" r="62"/><circle cx="460" cy="535" r="54" stroke-width="1.2"/><text x="460" y="527" font-size="13" font-weight="700" fill="#2c4fa3" stroke="none" text-anchor="middle" font-family="Arial">ДОРОЖНАЯ ПОЛИЦИЯ</text><text x="460" y="547" font-size="13" fill="#2c4fa3" stroke="none" text-anchor="middle" font-family="Arial">14.11.2026</text><text x="460" y="567" font-size="10" fill="#2c4fa3" stroke="none" text-anchor="middle" font-family="Arial">УЧЕБНЫЙ</text></g><g transform="rotate(-30 300 430)"><text x="300" y="450" font-size="44" font-weight="800" fill="#b03a2e" fill-opacity=".16" text-anchor="middle" font-family="Arial,sans-serif">ВЫМЫШЛЕНО · ОБРАЗЕЦ</text></g></g></g></g>
<rect width="720" height="960" fill="url(#glare)"/><rect width="720" height="960" fill="url(#vig)"/></svg>