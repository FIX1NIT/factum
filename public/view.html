<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Просмотр</title><link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
html,body{height:100%;margin:0;background:#0e1420;color:#aab8cf;font:13px 'Segoe UI',Arial,sans-serif}
body{display:flex;flex-direction:column}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid #25314a;background:#161e2c}
header b{color:#e4eaf4;font-weight:600}header span{font-size:11px;color:#8191a9}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:14px}
img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 12px 40px #0009;cursor:zoom-in}
img.full{max-width:none;max-height:none;cursor:zoom-out}
main.big{align-items:flex-start;justify-content:flex-start}
</style></head><body>
<header><b id="t">Просмотр</b><span>Нажмите на изображение, чтобы увеличить или вернуть</span></header>
<main id="m"><img id="i" alt=""></main>
<script>
const p=new URLSearchParams(location.search),src=p.get('src')||'',title=p.get('title')||'Просмотр';
if(/^\/(passports|scans|evidence)\/[\w.\-]+$/.test(src)){const i=document.getElementById('i');i.src=src;i.alt=title;document.getElementById('t').textContent=title;document.title=title;
i.onclick=()=>{const f=i.classList.toggle('full');document.getElementById('m').classList.toggle('big',f)}}
else document.getElementById('t').textContent='Файл не найден';
</script></body></html>
